services:
  - type: web
    name: weather-io
    runtime: docker
    rootDir: 25ESKCS029_Weather_Information_App
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
